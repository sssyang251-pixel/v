[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-analytics-agent"
version = "0.1.0"
description = "A transparent, file-based e-commerce operations analytics dashboard and report generator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
    "streamlit>=1.33,<2.0",
]

[project.scripts]
ecom-analytics = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["ecom_agent*"]
